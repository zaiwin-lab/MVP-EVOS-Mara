[build]
  # Type-checking (tsc -b) runs locally / in CI via `npm run build`.
  # On Netlify we run vite directly for a fast, robust production build.
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — all routes render index.html so deep links
# (e.g. /check-in from the QR code) work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
