    <title>ProgramOS Lite · Transformasi Digital & AI untuk Koperasi</title>
    <!-- Canonical/og:url: switch both to https://btdkoperasi.win/ once that
         domain resolves and Netlify has issued its certificate. Until then they
         must name a host that answers, or the share preview breaks. -->
    <link rel="canonical" href="https://angkasatda.netlify.app/" />

    <!-- Share card. The link gets forwarded on WhatsApp far more than it gets
         typed, so the preview is the first thing most people see of this
         programme. og:image must be an absolute URL — relative paths are
         silently ignored by every scraper. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProgramOS Lite" />
    <meta property="og:locale" content="ms_MY" />
    <meta property="og:url" content="https://angkasatda.netlify.app/" />
    <meta
      property="og:title"
      content="Transformasi Digital & AI untuk Koperasi"
    />
    <meta
      property="og:description"
      content="24 September 2026 · Hotel Serapi, Kuching. Inisiatif bersama ANGKASA, KOBIS Berhad & SDEC."
    />
    <meta property="og:image" content="https://angkasatda.netlify.app/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ProgramOS Lite — Digital & AI untuk Koperasi, 24 September 2026, Hotel Serapi, Kuching."
    />

    <meta
      name="twitter:title"
